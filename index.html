<style>
    .container{ 
        position: relative;
        width:500px;
        height:300px;
        margin:20px auto;
        border: 2px solid #333;
        /* valid pale background */
        background-color: #ff76d1;
         z-index:1;/*behind the text block*/
        opacity:0.7; 

    }

    .text-overlay{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            color: white;
            font-size: 24px;
            text-align: center;
            padding: 20px;
           
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            /* Allow underlying elements (like buttons) to receive clicks */
            pointer-events: none;
    }
</style>
