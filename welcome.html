<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
    .container{ 
        position: relative;
        width:500px;
        height:300px;
        margin:20px auto;
        border: 2px solid #333;
        /* valid pale background */
        background-color: #ff76d1;
         z-index:1;/*behind the text block*/
        opacity:0.7; 

    }

    .text-overlay{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            color: white;
            font-size: 24px;
            text-align: center;
            padding: 20px;
           
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            /* Allow underlying elements (like buttons) to receive clicks */
            pointer-events: none;
    }
</style>
    <title>Welcome to Party Scrapbook</title>
</head>
<body style="background-image: url('images/gp.png');">
    <div class="container">
        
        <div class="background-block"></div>
        <div class="text-overlay"></div>
 
    <h1>Welcome to my Party Scrapbook</h1>
    <p>This is where I'll keep all my party memories</p>

<button id="open-dialog-btn">Click to learn more!</button>

<dialog id="my-dialog">
  <h2>About this site</h2>
  <p>This is where I can keep all my party memories. From my Birthday party, like an onlinejournal!!</p>
  <form method="dialog">
    <button id="close-dialog-btn">Close</button>
  </form>
</dialog>
    

    </div>
    <script src="ps.js"></script>

</body>
</html>
